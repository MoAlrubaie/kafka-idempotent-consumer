# The real thing, for `make demo-redpanda`: a Redpanda broker, Redpanda Console and Postgres.
# Console runs at http://localhost:8080, where you can read refunds.approved.DLT and its error headers.
name: kafka-idempotent-consumer

services:
  redpanda:
    image: redpandadata/redpanda:v26.2.3
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30

  console:
    image: redpandadata/console:v3.12.0
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: refunds
      POSTGRES_USER: refunds
      POSTGRES_PASSWORD: refunds # local demo only
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "refunds", "-d", "refunds"]
      interval: 2s
      timeout: 5s
      retries: 30
